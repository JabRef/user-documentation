name: Label JabRef PR state

# Labels each open docs PR with the state of the first JabRef/jabref PR it references
on:
  schedule:
    - cron: 15 4 * * *
  pull_request_target:
    types: [opened, edited, reopened]
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: jabref-pr-labels
  cancel-in-progress: false

jobs:
  label:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - name: Update labels
        run: |
          # Colors of GitHub's PR state icons
          gh label create "jabref-pr: ready" --repo "$REPO" --color 1f883d --description "Referenced JabRef PR is open" --force
          gh label create "jabref-pr: draft" --repo "$REPO" --color 59636e --description "Referenced JabRef PR is a draft" --force
          gh label create "jabref-pr: merged" --repo "$REPO" --color 8250df --description "Referenced JabRef PR is merged" --force
          gh label create "jabref-pr: closed" --repo "$REPO" --color cf222e --description "Referenced JabRef PR is closed without merge" --force

          gh pr list --repo "$REPO" --state open --limit 500 --json number,body,labels \
            --jq '.[] | [.number, ((.body // "") | [scan("JabRef/jabref(?:#|/pull/)([0-9]+)")][0][0] // ""), ([.labels[].name | select(startswith("jabref-pr: "))] | join(","))] | @tsv' |
          while IFS=$'\t' read -r pr ref current; do
            want=""
            if [ -n "$ref" ]; then
              # Fails for issue references; those get no label
              state=$(gh pr view "$ref" --repo JabRef/jabref --json state,isDraft --jq 'if .state == "MERGED" then "merged" elif .state == "OPEN" then (if .isDraft then "draft" else "ready" end) else "closed" end' 2>/dev/null || true)
              [ -n "$state" ] && want="jabref-pr: $state"
            fi
            [ "$want" = "$current" ] && continue
            echo "#$pr: '$current' -> '$want'"
            IFS=, read -ra old <<< "$current"
            for l in "${old[@]}"; do
              gh api -X DELETE "repos/$REPO/issues/$pr/labels/$(jq -rn --arg l "$l" '$l|@uri')" > /dev/null
            done
            [ -n "$want" ] && gh api "repos/$REPO/issues/$pr/labels" -f "labels[]=$want" > /dev/null
          done
